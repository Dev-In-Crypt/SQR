name: Integration & E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-e2e-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run the app's own hermetic harnesses (scripts/run-integration-tests.ts
# and scripts/run-e2e-tests.ts): each creates an ephemeral Postgres schema, boots
# anvil, deploys ReceiptRegistry, starts a stubbed x402 facilitator and `next dev`,
# then tears everything down. CI only has to provide the binaries and a database.
#
# foundry.toml is intentionally gitignored (see README "Local setup notes" — the
# committed file makes the Slither CI action scan the vulnerable benchmark
# fixtures), so it is recreated here at runtime for forge/anvil.

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/solidity_quick_review?schema=public
  # Match the production/server scanner toolchain: Slither pinned to the version
  # the benchmark baseline was recorded with, solc resolved per-pragma.
  ENABLE_SOLC_AUTO_RESOLVE: "true"
  SOLC_VERSION_MANAGER: "solc-select"

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solidity_quick_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither and solc-select
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer==0.11.5 solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Create foundry.toml (gitignored on purpose — see README)
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "contracts"
          test = "contracts/test"
          out = "contracts/out"
          libs = ["lib"]
          solc = "0.8.24"
          optimizer = true
          optimizer_runs = 200
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: solidity_quick_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither and solc-select
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer==0.11.5 solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Create foundry.toml (gitignored on purpose — see README)
        run: |
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "contracts"
          test = "contracts/test"
          out = "contracts/out"
          libs = ["lib"]
          solc = "0.8.24"
          optimizer = true
          optimizer_runs = 200
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browser
        run: npm run playwright:install

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 7
